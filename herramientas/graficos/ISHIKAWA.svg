<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Diagrama Ishikawa — Santacara</title>
<desc>Diagrama causa-efecto de la despoblación en Santacara. Efecto principal: pérdida de población sostenida (-5 hab/año). Seis ramas de causas: vivienda, información, gestión municipal, empleo, normativa, dinámica sistémica.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, sans-serif; fill: #333; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th, .c-coral .ts { fill: #712B13; }
    .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th, .c-blue .ts { fill: #0C447C; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th, .c-teal .ts { fill: #085041; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th, .c-purple .ts { fill: #3C3489; }
    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th, .c-amber .ts { fill: #633806; }
  </style>
</defs>

<!-- Espina central -->
<line x1="80" y1="260" x2="560" y2="260" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Efecto: caja derecha -->
<g class="c-coral">
  <rect x="562" y="218" width="104" height="84" rx="8" stroke-width="0.5"/>
  <text class="th" x="614" y="248" text-anchor="middle" dominant-baseline="central">Pérdida de</text>
  <text class="th" x="614" y="266" text-anchor="middle" dominant-baseline="central">población</text>
  <text class="ts" x="614" y="285" text-anchor="middle" dominant-baseline="central">−5 hab./año</text>
</g>

<!-- RAMA 1: VIVIENDA (arriba izquierda) -->
<line x1="140" y1="260" x2="200" y2="160" stroke="#888" stroke-width="1.5"/>
<g class="c-blue">
  <rect x="100" y="118" width="140" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="170" y="137" text-anchor="middle" dominant-baseline="central">Vivienda</text>
</g>
<line x1="170" y1="118" x2="170" y2="98" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="170" y="90" text-anchor="middle" fill="#555">Sin oferta de alquiler</text>
<line x1="155" y1="118" x2="130" y2="88" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="118" y="83" text-anchor="middle" fill="#555">Activos sin inventariar</text>
<line x1="185" y1="118" x2="205" y2="90" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="222" y="84" text-anchor="middle" fill="#555">Sin modelo de retorno</text>

<!-- RAMA 2: INFORMACIÓN (arriba centro-izq) -->
<line x1="260" y1="260" x2="300" y2="155" stroke="#888" stroke-width="1.5"/>
<g class="c-teal">
  <rect x="222" y="118" width="148" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="296" y="137" text-anchor="middle" dominant-baseline="central">Información</text>
</g>
<line x1="285" y1="118" x2="265" y2="94" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="242" y="88" text-anchor="middle" fill="#555">Sin estrategia externa</text>
<line x1="310" y1="118" x2="325" y2="94" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="352" y="88" text-anchor="middle" fill="#555">Servicios desconocidos</text>

<!-- RAMA 3: GESTIÓN MUNICIPAL (arriba centro-dcha) -->
<line x1="390" y1="260" x2="420" y2="155" stroke="#888" stroke-width="1.5"/>
<g class="c-purple">
  <rect x="348" y="118" width="152" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="424" y="137" text-anchor="middle" dominant-baseline="central">Gestión municipal</text>
</g>
<line x1="400" y1="118" x2="380" y2="92" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="348" y="86" text-anchor="middle" fill="#555">Sin técnico de vivienda</text>
<line x1="445" y1="118" x2="460" y2="92" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="486" y="86" text-anchor="middle" fill="#555">Sin modelo financiero</text>

<!-- RAMA 4: EMPLEO (abajo izquierda) -->
<line x1="180" y1="260" x2="220" y2="365" stroke="#888" stroke-width="1.5"/>
<g class="c-amber">
  <rect x="142" y="364" width="140" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="212" y="383" text-anchor="middle" dominant-baseline="central">Empleo local</text>
</g>
<line x1="190" y1="402" x2="175" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="150" y="432" text-anchor="middle" fill="#555">GKN/Rockwool no comunicado</text>
<line x1="230" y1="402" x2="240" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="268" y="432" text-anchor="middle" fill="#555">Paro 10,8% vs media Navarra</text>

<!-- RAMA 5: NORMATIVA (abajo centro) -->
<line x1="340" y1="260" x2="360" y2="365" stroke="#888" stroke-width="1.5"/>
<g class="c-teal">
  <rect x="284" y="364" width="148" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="358" y="383" text-anchor="middle" dominant-baseline="central">Normativa y fondos</text>
</g>
<line x1="330" y1="402" x2="315" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="282" y="432" text-anchor="middle" fill="#555">NASUVINSA no activada</text>
<line x1="385" y1="402" x2="395" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="422" y="432" text-anchor="middle" fill="#555">Ley Foral pendiente</text>

<!-- RAMA 6: DINÁMICA SISTÉMICA (abajo dcha) -->
<line x1="470" y1="260" x2="475" y2="365" stroke="#888" stroke-width="1.5"/>
<g class="c-coral">
  <rect x="398" y="364" width="160" height="38" rx="6" stroke-width="0.5"/>
  <text class="th" x="478" y="376" text-anchor="middle" dominant-baseline="central">Dinámica</text>
  <text class="th" x="478" y="392" text-anchor="middle" dominant-baseline="central">sistémica (B1)</text>
</g>
<line x1="445" y1="402" x2="430" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="400" y="432" text-anchor="middle" fill="#555">Envejecimiento estructural</text>
<line x1="510" y1="402" x2="518" y2="424" stroke="#aaa" stroke-width="1"/>
<text class="ts" x="540" y="432" text-anchor="middle" fill="#555">Umbral 600 hab.</text>

<!-- Título -->
<text class="ts" x="340" y="490" text-anchor="middle" fill="#aaa">Ishikawa — Santacara · Despoblación rural</text>
</svg>
