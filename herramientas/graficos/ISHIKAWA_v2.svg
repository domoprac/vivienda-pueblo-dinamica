    .rf rect { fill: #FAECE7; stroke: #993C1D; }
    .rf .th, .rf .ts { fill: #712B13; }
    .efecto rect { fill: #F0997B; stroke: #993C1D; }
    .efecto .th, .efecto .ts { fill: #4A1B0C; }
    line { stroke: #888780; }
  </style>
</defs>
