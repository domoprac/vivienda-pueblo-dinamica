<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Ishikawa — causas de la despoblación en Santacara</title>
<desc>Diagrama causa-efecto con 6 ramas: vivienda, información, gestión municipal, empleo, normativa y dinámica sistémica. Efecto: pérdida de población sostenida −5 hab/año.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .th { font-size: 13px; font-weight: 600; }
    .ts { font-size: 11px; font-weight: 400; }
    .ra rect { fill: #EAF3DE; stroke: #3B6D11; }
    .ra .th, .ra .ts { fill: #27500A; }
    .rb rect { fill: #E1F5EE; stroke: #0F6E56; }
    .rb .th, .rb .ts { fill: #085041; }
    .rc rect { fill: #EEEDFE; stroke: #534AB7; }
    .rc .th, .rc .ts { fill: #3C3489; }
    .rd rect { fill: #FAEEDA; stroke: #854F0B; }
